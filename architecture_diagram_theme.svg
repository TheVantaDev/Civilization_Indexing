<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f5f6"/>
      <stop offset="100%" stop-color="#eef1f2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d6f68" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2a8f84"/>
    </marker>
  </defs>

  <rect width="1366" height="768" fill="url(#bgGrad)"/>

  <polygon points="0,0 160,0 95,155 0,130" fill="#57bdb4" opacity="0.95"/>
  <polygon points="1220,0 1366,0 1366,180 1280,145" fill="#b8cf45" opacity="0.96"/>
  <polygon points="0,612 132,640 170,768 0,768" fill="#b7d3dc" opacity="0.95"/>
  <polygon points="1188,768 1366,768 1366,592 1268,616" fill="#41b0a5" opacity="0.95"/>

  <text x="72" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#238d83">
    ARCHITECTURE DIAGRAM
  </text>
  <text x="74" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#4f6b6a">
    AI Civilisation Ethical Alignment and Risk Scoring Pipeline
  </text>

  <g filter="url(#softShadow)">
    <rect x="84" y="190" width="248" height="394" rx="18" fill="#ffffff" stroke="#8cc9c2" stroke-width="2"/>
    <text x="104" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2a8f84">Input CSVs</text>
    <line x1="104" y1="235" x2="312" y2="235" stroke="#d7e9e6"/>
    <text x="104" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">ethics.csv</text>
    <text x="104" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">ai_behavior.csv</text>
    <text x="104" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">culture.csv</text>
    <text x="104" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">ai_systems.csv</text>
    <text x="104" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      Raw records for principles,
    </text>
    <text x="104" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      behaviors, cultures, and
    </text>
    <text x="104" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      deployed AI systems.
    </text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="396" y="190" width="274" height="394" rx="18" fill="#ffffff" stroke="#8cc9c2" stroke-width="2"/>
    <text x="418" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2a8f84">Data Loading</text>
    <line x1="418" y1="235" x2="650" y2="235" stroke="#d7e9e6"/>
    <text x="418" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">load_ethics()</text>
    <text x="418" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">load_behaviors()</text>
    <text x="418" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">load_cultures()</text>
    <text x="418" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">load_ai_systems()</text>
    <text x="418" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      Parses CSV rows, validates
    </text>
    <text x="418" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      fields, and creates in-memory
    </text>
    <text x="418" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      records for scoring.
    </text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="734" y="150" width="300" height="216" rx="18" fill="#ffffff" stroke="#8cc9c2" stroke-width="2"/>
    <text x="754" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2a8f84">Core Structures</text>
    <line x1="754" y1="196" x2="1012" y2="196" stroke="#d7e9e6"/>
    <text x="754" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">BST: PrincipleNode</text>
    <text x="754" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">LL: BehaviorNode per principle</text>
    <text x="754" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">Arrays: Culture, AISystem</text>
    <text x="754" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      Behavior to principle mapping
    </text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="734" y="392" width="300" height="192" rx="18" fill="#ffffff" stroke="#8cc9c2" stroke-width="2"/>
    <text x="754" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2a8f84">Scoring Engine</text>
    <line x1="754" y1="437" x2="1012" y2="437" stroke="#d7e9e6"/>
    <text x="754" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">Ethical alignment</text>
    <text x="754" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">Cultural compatibility</text>
    <text x="754" y="537" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">Risk evaluation (3 categories)</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1096" y="190" width="228" height="394" rx="18" fill="#ffffff" stroke="#8cc9c2" stroke-width="2"/>
    <text x="1118" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2a8f84">Outputs</text>
    <line x1="1118" y1="235" x2="1302" y2="235" stroke="#d7e9e6"/>
    <text x="1118" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">Final index score</text>
    <text x="1118" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">Risk summaries</text>
    <text x="1118" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">Dashboard chart</text>
    <text x="1118" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#365353">CSV exports</text>
    <text x="1118" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      Stakeholder-ready view
    </text>
    <text x="1118" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      for governance and
    </text>
    <text x="1118" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#557473">
      decision confidence.
    </text>
  </g>

  <line x1="332" y1="388" x2="396" y2="388" stroke="#2a8f84" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="670" y1="388" x2="734" y2="388" stroke="#2a8f84" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1034" y1="388" x2="1096" y2="388" stroke="#2a8f84" stroke-width="4" marker-end="url(#arrow)"/>

  <circle cx="198" cy="640" r="9" fill="#b8cf45"/>
  <circle cx="226" cy="640" r="9" fill="#57bdb4"/>
  <circle cx="254" cy="640" r="9" fill="#2a8f84"/>
</svg>
